# Weekly copy of every table (see backup.py). The repo is public, and anyone
# signed in to GitHub can download a public repo's artifacts, so the CSVs are
# put in a password-protected 7z file (AES-256, file names hidden too) and only
# that is kept, as the run's `backups` artifact, for 90 days: Actions -> Backup
# -> the run. Needs two repository secrets (Settings -> Secrets and variables
# -> Actions): DATABASE_URL and BACKUP_PASSWORD. Without BACKUP_PASSWORD the
# run fails before touching the database. A failed run shows red and GitHub
# emails the owner.
name: Backup

on:
  schedule:
    # Sundays 11:00 UTC: 06:00 Chicago in summer (CDT), 05:00 in winter (CST).
    - cron: "0 11 * * 0"
  workflow_dispatch: # the "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check the backup password is set
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          if [ -z "$BACKUP_PASSWORD" ]; then
            echo "::error::Add the BACKUP_PASSWORD repository secret: the repo is public, so backups must be encrypted."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - run: pip install -r requirements.txt

      - run: python backup.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Encrypt the backup
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          command -v 7z >/dev/null || sudo apt-get install -y -qq p7zip-full
          7z a -t7z -mhe=on -p"$BACKUP_PASSWORD" finance-tracker-backup.7z ./data/backups/*.csv >/dev/null
          rm -rf data/backups
          7z t -p"$BACKUP_PASSWORD" finance-tracker-backup.7z >/dev/null

      - uses: actions/upload-artifact@v6
        with:
          name: backups
          path: finance-tracker-backup.7z
          if-no-files-found: error
          retention-days: 90
