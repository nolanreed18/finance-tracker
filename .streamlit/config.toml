# The dark look, Dark Desk (DESIGN.md), as app/theme.py defines it
# (tests/test_theme.py checks they match): what the page is drawn with before
# the app applies the saved choice.
[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
headingFont = "Inter"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
baseFontSize = 15
headingFontSizes = ["1.2rem", "1.05rem", "0.72rem", "0.95rem", "0.9rem", "0.85rem"]
headingFontWeights = [700, 700, 700, 700, 600, 600]
baseRadius = "10px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#4f91f2", "#02a998", "#dc701c", "#d863a0", "#b48c05", "#9f79e6", "#47ab4f", "#0aa0d2", "#e3645e", "#5b6777"]
blueColor = "#3b82f6"
greenColor = "#10b981"
orangeColor = "#f59e0b"
redColor = "#f43f5e"
grayColor = "#64748b"
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0b0f19"
secondaryBackgroundColor = "#101725"
textColor = "#f8fafc"
linkColor = "#06b6d4"
borderColor = "#1f222b"
codeBackgroundColor = "#0f172a"
dataframeBorderColor = "#1f222b"
dataframeHeaderBackgroundColor = "#0f172a"
violetColor = "#c084fc"

[theme.sidebar]
backgroundColor = "#0d121e"
secondaryBackgroundColor = "#101725"

[browser]
gatherUsageStats = false

[client]
# No "Deploy" button or developer menu in the toolbar.
toolbarMode = "minimal"
